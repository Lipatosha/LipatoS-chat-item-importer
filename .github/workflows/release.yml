name: Build and publish LipatoS Item Importer

on:
  push:
    branches: [main]
    paths:
      - module.json
      - scripts/**
      - styles/**
      - README.md
      - CHANGELOG.md
      - tests/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript and JSON
        run: |
          find scripts -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node -e 'const m=require("./module.json"); if(m.id!=="chat-item-importer"||!m.version||!m.manifest||!m.download)process.exit(1);'
          node tests/smoke.cjs
      - name: Build ZIP
        run: zip -q -r lipatos-chat-item-importer.zip module.json scripts styles README.md CHANGELOG.md
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p 'require("./module.json").version')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" lipatos-chat-item-importer.zip module.json --clobber
          else
            gh release create "$TAG" lipatos-chat-item-importer.zip module.json \
              --target "$GITHUB_SHA" \
              --title "LipatoS — Импорт предметов $TAG" \
              --notes "Foundry VTT 14 / D&D5e 6.0.5. Импорт встроенных Active Effects вместе с Activities и флагами автоматизации."
          fi
